<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneath the Org Chart</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <header>
    <h1>Beneath the Org Chart</h1>
    <p class="subtitle">A public demo of the Network Intelligence Layer, built on Lenny's open archive.</p>
  </header>

  <nav id="filters">
    <button data-edge="shared_language" class="active">Shared language</button>
    <button data-edge="trust">Trust</button>
    <button data-edge="all">All</button>
  </nav>

  <main>
    <div id="graph" aria-label="Network graph"></div>
    <aside id="detail" aria-live="polite">
      <p class="placeholder">Click a node to see how it shows up in the archive.</p>
    </aside>
  </main>

  <footer>
    <span id="meta"></span>
  </footer>

  <script src="/graph.js"></script>
</body>
</html>
